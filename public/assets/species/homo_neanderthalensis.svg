<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <radialGradient id="bgGrad_homo_neanderthalensis" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#141d2c" stop-opacity="1"/>
      <stop offset="60%" stop-color="#070c14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="themeGrad_homo_neanderthalensis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow_homo_neanderthalensis" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic / Museum Canvas Background -->
  <rect width="800" height="560" fill="url(#bgGrad_homo_neanderthalensis)"/>

  <!-- Technical Stratigraphic Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="60" y1="80" x2="740" y2="80"/>
    <line x1="60" y1="200" x2="740" y2="200"/>
    <line x1="60" y1="320" x2="740" y2="320"/>
    <line x1="60" y1="440" x2="740" y2="440"/>
    <line x1="160" y1="60" x2="160" y2="480"/>
    <line x1="320" y1="60" x2="320" y2="480"/>
    <line x1="480" y1="60" x2="480" y2="480"/>
    <line x1="640" y1="60" x2="640" y2="480"/>
  </g>

  <!-- Specimen Holographic Frame Header -->
  <rect x="60" y="35" width="680" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="#ef4444" stroke-opacity="0.25"/>
  <circle cx="85" cy="56" r="6" fill="#ef4444"/>
  <text x="105" y="61" fill="#f8fafc" font-family="'Space Grotesk', 'Outfit', sans-serif" font-weight="700" font-size="14" letter-spacing="1.5">ARCHIVO PALEONTOLÓGICO 3D</text>
  <text x="715" y="61" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">CENOZOICO • PLEISTOCENO • 0.4 – 0.04 MA</text>

  <!-- Central Specimen Silhouette Graphic -->
  <g transform="translate(0, 10)" color="#ef4444" filter="url(#glow_homo_neanderthalensis)" opacity="0.92">
    <g transform="translate(355, 140)" fill="currentColor" opacity="0.88"><ellipse cx="45" cy="35" rx="28" ry="26" stroke="currentColor" stroke-width="3"/><path d="M 20 68 L 70 68 L 75 175 L 15 175 Z" stroke="currentColor" stroke-width="4"/><line x1="15" y1="85" x2="-10" y2="165" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><line x1="75" y1="85" x2="100" y2="165" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><line x1="25" y1="175" x2="18" y2="290" stroke="currentColor" stroke-width="15" stroke-linecap="round"/><line x1="65" y1="175" x2="72" y2="290" stroke="currentColor" stroke-width="15" stroke-linecap="round"/><line x1="-15" y1="70" x2="-15" y2="320" stroke="#ffd700" stroke-width="4" stroke-linecap="round"/><polygon points="-15,60 -22,80 -8,80" fill="#ffd700"/><circle cx="40" cy="35" r="5" fill="#020408"/></g>
  </g>

  <!-- Ground Reference Line & Scale Ticks -->
  <line x1="100" y1="475" x2="700" y2="475" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
  <g stroke="#ef4444" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="100" y1="470" x2="100" y2="480"/>
    <line x1="250" y1="472" x2="250" y2="478"/>
    <line x1="400" y1="470" x2="400" y2="480"/>
    <line x1="550" y1="472" x2="550" y2="478"/>
    <line x1="700" y1="470" x2="700" y2="480"/>
  </g>

  <!-- Human Scale Silhouette (comparison indicator) -->
  <g transform="translate(680, 415)" fill="rgba(255, 255, 255, 0.28)">
    <circle cx="10" cy="8" r="6"/>
    <rect x="7" y="16" width="6" height="24" rx="2"/>
    <line x1="4" y1="22" x2="16" y2="22" stroke="rgba(255, 255, 255, 0.28)" stroke-width="3"/>
    <line x1="8" y1="40" x2="5" y2="58" stroke="rgba(255, 255, 255, 0.28)" stroke-width="3"/>
    <line x1="12" y1="40" x2="15" y2="58" stroke="rgba(255, 255, 255, 0.28)" stroke-width="3"/>
    <text x="10" y="70" fill="rgba(255, 255, 255, 0.45)" font-family="sans-serif" font-size="9" text-anchor="middle">Humano (1.8m)</text>
  </g>

  <!-- Species Nomenclature & Biometrics Footer -->
  <rect x="60" y="495" width="680" height="45" rx="8" fill="rgba(10, 16, 26, 0.85)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="80" y="522" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Hombre de Neandertal (Cazador Glaciar)</text>
  <text x="80" y="534" fill="#94a3b8" font-family="'Outfit', sans-serif" font-style="italic" font-size="11">Homo neanderthalensis</text>
  <text x="720" y="523" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Altura: 1.65 m | Capacidad craneal: 1,500 cc | Tórax en barril, cultura lítica musteriense y fuego</text>
</svg>